<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerBuild</title>
  <style>
    :root { --amber: #e8a317; --bg: #0f0f0f; --card: #1a1a1a; --text: #f5f5f5; --muted: #a3a3a3; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: 2rem; margin: 0 0 0.25rem; }
    .tagline { color: var(--muted); margin-bottom: 2rem; }
    .card { background: var(--card); border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1rem; margin: 0 0 0.75rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.04em; }
    a { color: var(--amber); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { margin: 0; padding-left: 1.25rem; }
    li { margin-bottom: 0.35rem; }
    footer { margin-top: 2rem; font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>PowerBuild</h1>
    <p class="tagline">Strength programs, set logging, and progress tracking for iOS.</p>

    <div class="card">
      <h2>Links</h2>
      <ul>
        <li><a href="support.html">Support</a></li>
        <li><a href="privacy.html">Privacy Policy</a></li>
      </ul>
    </div>

    <div class="card">
      <h2>Get the app</h2>
      <p>PowerBuild is available on the App Store for iPhone (iOS 17+).</p>
    </div>

    <footer>
      <p>&copy; 2026 Aaron Graffam. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
